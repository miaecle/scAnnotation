# Axis 4: curated marker panel — structured positive/negative marker information
# Supplemented by top-50 expressed genes for additional context

dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: true
  exclude_hb: true
  exclude_tcr_ig: false  # keep Ig constant genes (informative for B/plasma cells)
  exclude_sex_chr: false

selection:
  strategy: marker_panel
  n_top: 50             # supplementary top-N genes shown after markers
  modalities: [rna, adt]
  marker_panel_path: configs/markers/pbmc_broad_lineage.yaml

input:
  mode: single_cell

llm:
  backend: gemini
  model: gemini-2.0-flash
  temperature: 0.0
  max_tokens: 512
  api_key_env: GOOGLE_API_KEY

evaluation:
  label_col: celltype.l1
  n_per_class: 5
  seed: 42
  strategies: [exact, keyword]

output:
  results_dir: results
  experiment_name: pbmc_l1_marker_panel_gemini_flash
  save_results: true
