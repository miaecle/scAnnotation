# Axis 2: kNN-smoothed (k=10) — reduces single-cell noise
# Axis 4: z-score selection on the smoothed vector

dataset_path: Datasets/HLCA/hlca_core.h5ad
tissue: lung parenchyma # lung parenchyma | nose | respiratory airway

evaluation:
  random: true
  label_col: cell_type
  hierarchy: ["ann_level_1","ann_level_2","ann_level_3","cell_type"]
  n_per_class: 20
  seed: 42
  strategies: [exact,hierarchy]
  concurrency: 20
  n_bootstrap: 1000

output:
  results_dir: results/hlca_new/hlca_lp_random
  experiment_name: hlca_lp_random
  save_results: true
