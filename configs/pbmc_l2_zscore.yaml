# Axis 3: conservative + HB + TCR/Ig VDJ filtering
# Axis 4: top-500 by z-score (cell-specific markers)
# Axis 2: single cell

dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC

global_metrics:
  n_top_hvg: 2000
  min_cells_pct: 0.01
  compute_gini: false
  gini_scope: hvg

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: false
  exclude_hb: true
  exclude_tcr_ig: true
  exclude_sex_chr: false
  gini_min: null

selection:
  strategy: zscore
  n_top: 20
  n_top_secondary: 50
  modalities: [rna, adt]
  marker_panel_path: null

input:
  mode: single_cell

llm:
  backend: deepseek
  model: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 4096
  api_key_env: DEEPSEEK_API_KEY
  use_context_cache: true
  context_cache_ttl_seconds: 3600
  concurrency: 20

evaluation:
  label_col: celltype.l2
  n_per_class: 20
  seed: 42
  strategies: [exact, keyword, llm_judge_binary]
  judge_backend: deepseek
  concurrency: 20

stage2:
  enabled: true
  model: deepseek-v4-flash

output:
  results_dir: results/pbmc/pbmc_l2_single_zscore20_20pc_stg2_seed42_deepseek_v4_flash
  experiment_name: pbmc_l2_single_zscore20_20pc_stg2_seed42_deepseek_v4_flash
  save_results: true