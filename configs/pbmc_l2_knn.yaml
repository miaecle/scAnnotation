# Axis 2: kNN-smoothed (k=10) — reduces single-cell noise
# Axis 4: z-score selection on the smoothed vector

dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC

global_metrics:
  n_top_hvg: 2000
  min_cells_pct: 0.01
  compute_gini: false
  gini_scope: hvg

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: false
  exclude_hb: true
  exclude_tcr_ig: true
  exclude_sex_chr: false
  gini_min: null

selection:
  strategy: tfidf
  n_top: 50
  modalities: [rna, adt]

input:
  mode: knn_smoothed
  knn_k: 10
  knn_use_rep: X_pca   # PCA computed on the fly if not present in obsm

llm:
  backend: deepseek
  model: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 20000
  api_key_env: DEEPSEEK_API_KEY
  concurrency: 10
  use_context_cache: true
  context_cache_ttl_seconds: 3600

evaluation:
  label_col: celltype.l2
  hierarchy: [celltype.l1, celltype.l2]
  n_per_class: 20
  seed: 42
  strategies: [exact, hierarchy]
  judge_backend: deepseek
  concurrency: 10
  n_bootstrap: 1000

stage2:
  mode: strict  # strict | combined
  score_method: tirosh   # mean_z | tirosh | ucell
  enabled: true
  model: deepseek-v4-flash

inspect:
  enabled: false
  cell_indices: [13748, 48, 6148]  # e.g. [13748]

output:
  results_dir: results/pbmc_new/pbmc_l2_knn_k10_20pc_stg2_tirosh_tfidf50_deepseek_v4_flash
  experiment_name: pbmc_l2_knn_k10_20pc_stg2_tirosh_tfidf50_deepseek_v4_flash
  save_results: true
