# Axis 2: kNN-smoothed (k=10) — reduces single-cell noise
# Axis 4: z-score selection on the smoothed vector

dataset_path: Datasets/HLCA/hlca_core.h5ad
tissue: lung parenchyma # lung parenchyma | nose | respiratory airway

global_metrics:
  n_top_hvg: 2000
  min_cells_pct: 0.01
  compute_gini: false
  gini_scope: hvg

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: false
  exclude_hb: true
  exclude_tcr_ig: true
  exclude_sex_chr: false
  gini_min: null

selection:
  strategy: tfidf
  n_top: 50
  modalities: [rna]

input:
  mode: knn_smoothed
  knn_k: 10
  knn_use_rep: X_pca   # PCA computed on the fly if not present in obsm

llm:
  backend: gemini
  model: gemini-3.5-flash
  temperature: 0.0
  max_tokens: 20000
  api_key_env: GOOGLE_API_KEY
  concurrency: 30
  use_context_cache: true
  context_cache_ttl_seconds: 3600

evaluation:
  label_col: cell_type
  n_per_class: 20
  seed: 42
  strategies: [exact]
  concurrency: 20

stage2:
  mode: strict  # strict | combined
  score_method: tirosh   # mean_z | tirosh | ucell
  enabled: false
  model: gemini-3.5-flash

output:
  results_dir: results/hlca_new/hlca_lp_knn_k10_20pc_stg1_tfidf50_gemini_3.5_flash
  experiment_name: hlca_lp_knn_k10_20pc_stg1_tfidf50_gemini_3.5_flash
  save_results: true
