# Axis 2: pseudobulk — upper bound; uses mean expression of all cells of the same type
# This leaks label information and represents a theoretical accuracy ceiling.

dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC

global_metrics:
  n_top_hvg: 2000
  min_cells_pct: 0.01
  compute_gini: false
  gini_scope: hvg

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: false
  exclude_hb: true
  exclude_tcr_ig: true
  exclude_sex_chr: false
  gini_min: null

selection:
  strategy: tfidf
  n_top: 200
  modalities: [rna, adt]

input:
  mode: pseudobulk   # uses label_col from evaluation section

llm:
  backend: deepseek
  model: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 4096
  api_key_env: DEEPSEEK_API_KEY
  use_context_cache: true
  context_cache_ttl_seconds: 3600
  concurrency: 20

evaluation:
  label_col: celltype.l2
  n_per_class: 1
  seed: 42
  strategies: [exact]
  judge_backend: deepseek
  concurrency: 20

stage2:
  enabled: false
  mode: strict  # strict | combined
  score_method: tirosh   # mean_z | tirosh | ucell
  model: deepseek-v4-flash

output:
  results_dir: results/pbmc_new_topgene/pbmc_l2_pseudobulk_stg1_tfidf200_ds_v4_flash
  experiment_name: pbmc_l2_pseudobulk_stg1_tfidf200_ds_v4_flash
  save_results: true
