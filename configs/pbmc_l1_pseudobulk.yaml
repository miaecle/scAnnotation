# Axis 2: pseudobulk — upper bound; uses mean expression of all cells of the same type
# This leaks label information and represents a theoretical accuracy ceiling.

dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: true
  exclude_hb: true
  exclude_tcr_ig: true
  exclude_sex_chr: false

selection:
  strategy: tfidf
  n_top: 500
  modalities: [rna, adt]

input:
  mode: pseudobulk   # uses label_col from evaluation section

llm:
  backend: gemini
  model: gemini-2.5-flash
  temperature: 0.0
  max_tokens: 512
  api_key_env: GOOGLE_API_KEY

evaluation:
  label_col: celltype.l1
  n_per_class: 5
  seed: 42
  strategies: [exact, keyword]

output:
  results_dir: results
  experiment_name: pbmc_l1_pseudobulk_zscore_gemini_flash
  save_results: true
