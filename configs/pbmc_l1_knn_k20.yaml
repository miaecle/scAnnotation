# Axis 2: kNN-smoothed (k=20) — reduces single-cell noise
# Axis 4: z-score selection on the smoothed vector

dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC

filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: true
  exclude_hb: true
  exclude_tcr_ig: true
  exclude_sex_chr: false

selection:
  strategy: zscore
  n_top: 500
  modalities: [rna, adt]

input:
  mode: knn_smoothed
  knn_k: 20
  knn_use_rep: X_pca   # PCA computed on the fly if not present in obsm

llm:
  backend: gemini
  model: gemini-2.0-flash
  temperature: 0.0
  max_tokens: 512
  api_key_env: GOOGLE_API_KEY

evaluation:
  label_col: celltype.l1
  n_per_class: 5
  seed: 42
  strategies: [exact, keyword]

output:
  results_dir: results
  experiment_name: pbmc_l1_knn_k20_zscore_gemini_flash
  save_results: true
