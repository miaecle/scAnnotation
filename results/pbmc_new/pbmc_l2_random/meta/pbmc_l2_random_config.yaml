evaluation:
  label_col: celltype.l2
  random: true
  hierarchy:
  - celltype.l1
  - celltype.l2
  n_per_class: 20
  seed: 42
  strategies:
  - exact
  - hierarchy
  judge_backend: deepseek
  concurrency: 10
  n_bootstrap: 1000
  bootstrap_seed: 42
dataset_path: Datasets/PBMC_CiteSeqRef/pbmc_citeseq_ref_2021.h5ad
tissue: PBMC
global_metrics:
  n_top_hvg: 2000
  min_cells_pct: 0.01
  compute_gini: true
  gini_scope: hvg
filter:
  exclude_mt: true
  exclude_ribo: true
  exclude_low_expr: true
  exclude_hb: false
  exclude_tcr_ig: false
  exclude_sex_chr: false
  gini_min: 0.02
selection:
  strategy: zscore
  n_top: 500
  n_top_secondary: 50
  modalities:
  - rna
  marker_panel_path: null
input:
  mode: single_cell
  knn_k: 20
  knn_use_rep: X_pca
llm:
  backend: gemini
  model: gemini-2.0-flash
  temperature: 0.0
  max_tokens: 4096
  api_key_env: null
  concurrency: 1
  use_context_cache: false
  context_cache_ttl_seconds: 3600
stage2:
  enabled: false
  model: null
  temperature: 0.0
  max_tokens: 4096
  mode: strict
  n_program_genes: 50
  score_method: tirosh
  score_min_genes: 3
  score_n_background: 50
  score_random_state: 0
  n_top_genes: 30
  n_top_proteins: 15
  program_query_max_output_tokens: 25600
  program_query_thinking_budget: 0
output:
  results_dir: results/pbmc_new/pbmc_l2_random
  experiment_name: pbmc_l2_random
  save_results: true
inspect:
  enabled: false
  cell_indices: []
  save_path: null
